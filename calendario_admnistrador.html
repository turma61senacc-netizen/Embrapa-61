
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendário</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header class="cabecalho">
            <h1>Calendário</h1>

            <button class="btn-criar" type="button">
                <span class="icone-plus">+</span>
                Criar ano
            </button>
        </header>

        <section class="calendarios">

            <!-- Calendário 2025 -->
            <article class="card-calendario fechado">
                <div class="card-topo">
                    <span class="status">Fechado</span>

                    <label class="switch">
                        <input type="checkbox" aria-label="Abrir calendário de 2025">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="icone-calendario">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="14" width="40" height="40" rx="5"/>
                        <line x1="12" y1="25" x2="52" y2="25"/>
                        <line x1="21" y1="9" x2="21" y2="18"/>
                        <line x1="43" y1="9" x2="43" y2="18"/>
                        <circle cx="22" cy="33" r="1.5"/>
                        <circle cx="32" cy="33" r="1.5"/>
                        <circle cx="42" cy="33" r="1.5"/>
                        <circle cx="22" cy="42" r="1.5"/>
                        <circle cx="32" cy="42" r="1.5"/>
                        <circle cx="42" cy="42" r="1.5"/>
                    </svg>
                </div>

                <h2>2025</h2>
                <button class="btn-editar" type="button">Editar</button>
            </article>

            <!-- Calendário 2026 -->
            <article class="card-calendario fechado">
                <div class="card-topo">
                    <span class="status">Fechado</span>

                    <label class="switch">
                        <input type="checkbox" aria-label="Abrir calendário de 2026">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="icone-calendario">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="14" width="40" height="40" rx="5"/>
                        <line x1="12" y1="25" x2="52" y2="25"/>
                        <line x1="21" y1="9" x2="21" y2="18"/>
                        <line x1="43" y1="9" x2="43" y2="18"/>
                        <circle cx="22" cy="33" r="1.5"/>
                        <circle cx="32" cy="33" r="1.5"/>
                        <circle cx="42" cy="33" r="1.5"/>
                        <circle cx="22" cy="42" r="1.5"/>
                        <circle cx="32" cy="42" r="1.5"/>
                        <circle cx="42" cy="42" r="1.5"/>
                    </svg>
                </div>

                <h2>2026</h2>
                <button class="btn-editar" type="button">Editar</button>
            </article>

            <!-- Calendário 2027 -->
            <article class="card-calendario aberto">
                <div class="card-topo">
                    <span class="status">Aberto</span>

                    <label class="switch">
                        <input type="checkbox" checked aria-label="Fechar calendário de 2027">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="icone-calendario">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="14" width="40" height="40" rx="5"/>
                        <line x1="12" y1="25" x2="52" y2="25"/>
                        <line x1="21" y1="9" x2="21" y2="18"/>
                        <line x1="43" y1="9" x2="43" y2="18"/>
                        <circle cx="22" cy="33" r="1.5"/>
                        <circle cx="32" cy="33" r="1.5"/>
                        <circle cx="42" cy="33" r="1.5"/>
                        <circle cx="22" cy="42" r="1.5"/>
                        <circle cx="32" cy="42" r="1.5"/>
                        <circle cx="42" cy="42" r="1.5"/>
                    </svg>
                </div>

                <h2>2027</h2>
                <button class="btn-editar" type="button">Editar</button>
            </article>

            <!-- Calendário 2028 -->
            <article class="card-calendario aberto">
                <div class="card-topo">
                    <span class="status">Aberto</span>

                    <label class="switch">
                        <input type="checkbox" checked aria-label="Fechar calendário de 2028">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="icone-calendario">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="14" width="40" height="40" rx="5"/>
                        <line x1="12" y1="25" x2="52" y2="25"/>
                        <line x1="21" y1="9" x2="21" y2="18"/>
                        <line x1="43" y1="9" x2="43" y2="18"/>
                        <circle cx="22" cy="33" r="1.5"/>
                        <circle cx="32" cy="33" r="1.5"/>
                        <circle cx="42" cy="33" r="1.5"/>
                        <circle cx="22" cy="42" r="1.5"/>
                        <circle cx="32" cy="42" r="1.5"/>
                        <circle cx="42" cy="42" r="1.5"/>
                    </svg>
                </div>

                <h2>2028</h2>
                <button class="btn-editar" type="button">Editar</button>
            </article>

            <!-- Calendário 2029 -->
            <article class="card-calendario fechado">
                <div class="card-topo">
                    <span class="status">Fechado</span>

                    <label class="switch">
                        <input type="checkbox" aria-label="Abrir calendário de 2029">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="icone-calendario">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="14" width="40" height="40" rx="5"/>
                        <line x1="12" y1="25" x2="52" y2="25"/>
                        <line x1="21" y1="9" x2="21" y2="18"/>
                        <line x1="43" y1="9" x2="43" y2="18"/>
                        <circle cx="22" cy="33" r="1.5"/>
                        <circle cx="32" cy="33" r="1.5"/>
                        <circle cx="42" cy="33" r="1.5"/>
                        <circle cx="22" cy="42" r="1.5"/>
                        <circle cx="32" cy="42" r="1.5"/>
                        <circle cx="42" cy="42" r="1.5"/>
                    </svg>
                </div>

                <h2>2029</h2>
                <button class="btn-editar" type="button">Editar</button>
            </article>

            <!-- Calendário 2030 -->
            <article class="card-calendario fechado">
                <div class="card-topo">
                    <span class="status">Fechado</span>

                    <label class="switch">
                        <input type="checkbox" aria-label="Abrir calendário de 2030">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="icone-calendario">
                    <svg viewBox="0 0 64 64" aria-hidden="true">
                        <rect x="12" y="14" width="40" height="40" rx="5"/>
                        <line x1="12" y1="25" x2="52" y2="25"/>
                        <line x1="21" y1="9" x2="21" y2="18"/>
                        <line x1="43" y1="9" x2="43" y2="18"/>
                        <circle cx="22" cy="33" r="1.5"/>
                        <circle cx="32" cy="33" r="1.5"/>
                        <circle cx="42" cy="33" r="1.5"/>
                        <circle cx="22" cy="42" r="1.5"/>
                        <circle cx="32" cy="42" r="1.5"/>
                        <circle cx="42" cy="42" r="1.5"/>
                    </svg>
                </div>

                <h2>2030</h2>
                <button class="btn-editar" type="button">Editar</button>
            </article>

        </section>

    </main>

    <script>
        const calendarios = document.querySelectorAll(".card-calendario");

        calendarios.forEach((card) => {
            const interruptor = card.querySelector(".switch input");
            const status = card.querySelector(".status");

            function atualizarCalendario() {
                const aberto = interruptor.checked;

                card.classList.toggle("aberto", aberto);
                card.classList.toggle("fechado", !aberto);

                status.textContent = aberto ? "Aberto" : "Fechado";

                const ano = card.querySelector("h2").textContent;
                interruptor.setAttribute(
                    "aria-label",
                    aberto
                        ? `Fechar calendário de ${ano}`
                        : `Abrir calendário de ${ano}`
                );
            }

            interruptor.addEventListener("change", atualizarCalendario);
            atualizarCalendario();
        });
    </script>

</body>
</html>
