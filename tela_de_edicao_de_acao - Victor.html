<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="pesquisador.css">
</head>
<body>
    <fieldset>
        <div class="edicao_de_acao_cabecalho">
            <div class="postar_acao_topo">
                <label for="titulo_acao" class="titulo">Nome:</label><br>
                <input type="text" id="titulo_acao" name="titulo_acao" placeholder="Nome da Ação" maxlength="20" size="50" required><br>
            </div>
            <div class="postar_acao_topo">
                <label for="nome_acao" class="titulo">Pesquisador:</label><br>
                <input type="text" id="nome_acao" name="nome_acao" placeholder="Nome do Pesquisador" maxlength="12" size="50" required><br>
            </div>
            <div class="postar_acao_topo">
                <label for="data_acao" class="titulo">Data de Execução:</label><br>
                <input type="date" id="data_acao" name="date" placeholder="00/00/0000" maxlength="10" size="20" required>
            </div>
        </div>
    
        <label for="descricao" class="titulo">Descrição:</label><br>
        <textarea
            id="descricao"
            name="descricao"
            rows="5"
            cols="126"
            placeholder="Digite a descrição da sua ação aqui...">
        </textarea>
    </fieldset>
</body>
</html>
