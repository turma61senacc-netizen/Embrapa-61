<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relatório de Usuários e suas Atividades</title>
  <link rel="stylesheet" href="../../../public/css/main.css">
</head>
<body>

  <main class="administrador-relatorio-usuario">
    
    <!-- Cabeçalho -->
    <header class="administrador-relatorio-usuario--header">
      <div class="administrador-relatorio-usuario--logo-container">
        <!-- Substitua pelo caminho real da imagem da logo -->
        <img src="logo-embrapa.png" alt="Logo Embrapa Gado de Corte" class="administrador-relatorio-usuario--logo">
        <span class="administrador-relatorio-usuario--sublogo">Gado de Corte</span>
      </div>

      <h1 class="administrador-relatorio-usuario--titulo">
        Relatório de Usuários e suas Atividades
      </h1>

      <div class="administrador-relatorio-usuario--meta-info">
        <p class="administrador-relatorio-usuario--meta-item">Ano: 2025</p>
        <p class="administrador-relatorio-usuario--meta-item">Emissão: 17/12/2025</p>
        <p class="administrador-relatorio-usuario--meta-item">Instituição: Embrapa</p>
      </div>
    </header>

    <!-- Cards de Métricas -->
    <section class="administrador-relatorio-usuario--cards">
      <div class="administrador-relatorio-usuario--card">
        <span class="administrador-relatorio-usuario--card-label">Total de usuários:</span>
        <span class="administrador-relatorio-usuario--card-value">58</span>
      </div>

      <div class="administrador-relatorio-usuario--card">
        <span class="administrador-relatorio-usuario--card-label">Pesquisadores</span>
        <span class="administrador-relatorio-usuario--card-value">33</span>
      </div>

      <div class="administrador-relatorio-usuario--card">
        <span class="administrador-relatorio-usuario--card-label">Comitê</span>
        <span class="administrador-relatorio-usuario--card-value">20</span>
      </div>

      <div class="administrador-relatorio-usuario--card">
        <span class="administrador-relatorio-usuario--card-label">Validadores:</span>
        <span class="administrador-relatorio-usuario--card-value">5</span>
      </div>
    </section>

    <!-- Seção: Pesquisador -->
    <section class="administrador-relatorio-usuario--secao">
      <h2 class="administrador-relatorio-usuario--subtitulo">Pesquisador</h2>
      <div class="administrador-relatorio-usuario--grafico-box">
        <!-- Placeholder ou imagem do gráfico -->
        <img src="grafico-pesquisador.png" alt="Número de Pesquisas Enviadas e Aprovadas" class="administrador-relatorio-usuario--grafico-img">
      </div>
    </section>

    <!-- Seção: Validador -->
    <section class="administrador-relatorio-usuario--secao">
      <h2 class="administrador-relatorio-usuario--subtitulo">Validador</h2>
      <div class="administrador-relatorio-usuario--grafico-box">
        <!-- Placeholder ou imagem do gráfico -->
        <img src="grafico-validador.png" alt="Número de Pesquisas Aprovadas e Negadas" class="administrador-relatorio-usuario--grafico-img">
      </div>
    </section>

    <!-- Seção: Comitê -->
    <section class="administrador-relatorio-usuario--secao">
      <h2 class="administrador-relatorio-usuario--subtitulo">Comitê</h2>
      <div class="administrador-relatorio-usuario--grafico-box">
        <!-- Placeholder ou imagem do gráfico -->
        <img src="grafico-comite.png" alt="Estatísticas do comitê em relação aos Pesquisadores" class="administrador-relatorio-usuario--grafico-img">
      </div>
    </section>

  </main>

</body>
</html>
