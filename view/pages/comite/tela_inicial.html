<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Principal</title>
    <!-- <link rel="stylesheet" href="../../../public/css/main.css"> -->
    <link rel="stylesheet" href="../../../public/css/tela_inicial.css">
    <link rel="stylesheet" href="../../../public/css/style.css">
</head>
<body>

<main class="comite-painelPrincipal--container--principal">
  <div class="comite-painelPrincipal--container--geral">
    <div class="comite-painelPrincipal--painel--principal">
    
    <header class="comite-painelPrincipal--header--topo">
      <button type="button" class="comite-painelPrincipal--botao--gerarRelatorio" id="comite-painelPrincipal--botao--gerarRelatorio">
        <img 
          src="../../../public/imagens/icone_excel.png" 
          alt="Ícone Excel" 
          class="comite-painelPrincipal--icone--excel" 
        />
        <span>Baixar em Excel</span>
      </button>

      <h1 class="comite-painelPrincipal--titulo--principal">Relatórios</h1>
    </header>

    <section class="comite-painelPrincipal--secao--filtros">
      
      <div class="comite-painelPrincipal--grupo--campo">
        <label for="comite-painelPrincipal--select--tipo" class="comite-painelPrincipal--label--tipo">Tipo:</label>
        <select id="comite-painelPrincipal--select--tipo" class="comite-painelPrincipal--select--tipo">
          <option value="aberto">Aberto</option>
          <option value="fechado">Fechado</option>
        </select>
      </div>

      <div class="comite-painelPrincipal--grupo--campo comite-painelPrincipal--grupo--ano">
        <label class="comite-painelPrincipal--label--ano">Ano:</label>
        <div class="comite-painelPrincipal--inputs--ano">
          <input type="date" id="comite-painelPrincipal--input--anoInicio" class="comite-painelPrincipal--input--ano" placeholder="De">
          <input type="date" id="comite-painelPrincipal--input--anoFim" class="comite-painelPrincipal--input--ano" placeholder="Até">
        </div>
      </div>

      <div class="comite-painelPrincipal--grupo--campo">
        <label for="comite-painelPrincipal--select--pesquisador" class="comite-painelPrincipal--label--pesquisador">Pesquisador:</label>
        <select id="comite-painelPrincipal--select--pesquisador" class="comite-painelPrincipal--select--pesquisador">
          <option value="todos">Todos</option>
        </select>
      </div>

    </section>

    <section class="comite-painelPrincipal--secao--preview">
      <h2 class="comite-painelPrincipal--subtitulo--preview">Pré-visualização:</h2>
      
      <div class="comite-painelPrincipal--card--preview">
        <img 
          src="../../../public/imagens/icone_preencher_campo.png" 
          alt="Ícone Pré-visualização" 
          class="comite-painelPrincipal--icone--documento" 
        />
        <p class="comite-painelPrincipal--mensagem--vazia">Preencha todos os campos para a visualização do relatório</p>
      </div>
    </section>

  </div>
  </div>
</main>
</body>
</html>
