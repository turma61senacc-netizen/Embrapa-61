<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivo para rejeição da ação</title>
  <link rel="stylesheet" href="../../../public/css/main.css">
</head>
<body>
  <div class="validador-pop--fundo" id="pop-validador-fundo">
    <div class="validador-pop--janela" role="dialog">
      <h2 class="validador-pop-titulo" id="pop-validador-titulo">Motivo para rejeição da ação</h2>

      <label class="validador-pop--rotulo" for="pop_validador_razao">Razão</label>
      <textarea class="validador-pop--campo-razao" id="pop-validador-razao" placeholder="Explique por que a ação foi rejeitada, disserte sobre."></textarea>
      

      <div class="validador-pop--botoes">
        <button type="button" class=" validador-pop--botao validador-pop--botao-cancelar" id="pop-validador-cancelar">Cancelar</button>
        <button type="button" class="validador-pop--botao validador-pop--botao-enviar" id="pop-validador-enviar">Enviar</button>
      </div>
    </div>
  </div>

  <script src="../../../public/js/pop_up_motivo_acao.js"></script>
</body>
</html>
