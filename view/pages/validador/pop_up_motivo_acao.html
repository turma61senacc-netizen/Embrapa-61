<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivo para rejeição da ação</title>
  <link rel="stylesheet" href="../../../public/css/style2.css">
</head>
<body>
  <div class="fundo-site" id="fundo-site">
    <div class="popup" role="dialog" aria-labelledby="tituloPopup">
      <h2 id="tituloPopup">Motivo para rejeição da ação</h2>

      <label for="razao">Razão</label>
      <textarea id="razao" placeholder="Explique o porquê a ação foi rejeitada, disserte sobre."></textarea>
     

      <div class="botoes">
        <button type="button" class="botao botao-cancelar" id="cancelar">Cancelar</button>
        <button type="button" class="botao botao-enviar" id="enviar">Enviar</button>
      </div>
    </div>
  </div>

  <script src="pop_up_motivo_acao.js"></script>
</body>
</html>
