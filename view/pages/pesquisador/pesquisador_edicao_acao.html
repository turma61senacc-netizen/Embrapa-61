    <!-- Preciso saber as configurações do aside/header do menu novo que está sendo feito, para pode ajustar a posição da tabela de edição -->
    
    <div class="pesquisador-edicao--acao--container--tabela--edicao">
        <h1 class="pesquisador-edicao--acao--titulo">Edição</h1>

        <div class="pesquisador-edicao--acao--tabela--edicao">

            <div class="pesquisador-edicao--acao--titulo--data--realizacao">
                <div class="pesquisador-edicao--acao--titulo--acao">
                    <label for="pesquisador-edicao--acao--campo--titulo" class="pesquisador-edicao--acao--label--titulo--acao">Título da ação:</label>
                    <input type="text" id="pesquisador-edicao--acao--campo--titulo" class="pesquisador-edicao--acao--input--titulo--acao" placeholder="Palestra">
                </div>

                <div class="pesquisador-edicao--acao--data--realizacao">
                    <label for="pesquisador-edicao--acao--campo--data--realizacao" class="pesquisador-edicao--acao--label--data--realizacao">Data de Realização:</label>
                    <input type="date" id="pesquisador-edicao--acao--campo--data--realizacao" class="pesquisador-edicao--acao--input--data--realizacao">
                </div>
            </div>

            <label for="pesquisador-edicao--acao--campo--descricao" class="pesquisador-edicao--acao--label--descricao-acao">Descrição:</label>
            <textarea id="pesquisador-edicao--acao--campo--descricao" class="pesquisador-edicao--acao--textarea--descricao--acao" name="descricao" rows="5" placeholder="Digite a descrição da sua ação aqui...">lore ipsum dolor sit amet</textarea>


            <label for="pesquisador-edicao--acao--campo--categoria--acao" class="pesquisador-edicao--acao--label--categoria--acao">Categoria da ação:</label>
            <select id="pesquisador-edicao--acao--campo--categoria--acao" class="pesquisador-edicao--acao--select--categoria--acao">
                <option value="" disabled selected hidden>Selecione a categoria</option>
                <option value="palestra">Palestra</option>
                <option value="oficina">Oficina</option>
                <option value="visita_tecnica">Visita Técnica</option>
                <option value="evento">Evento</option>
            </select>

            <div class="pesquisador-edicao--acao--comprovantes--cabecalho">
                <h2 class="pesquisador-edicao--acao--comprovantes">Comprovantes:</h2>
            
            </div>

            <div class="pesquisador-edicao--acao--lista" id="pesquisador-edicao--acao--lista--arquivos">
                lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod. Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod. Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quod.

            </div>

            <div class="pesquisador-edicao--acao--botoes--edicao">
                <button type="button" class="pesquisador-edicao--acao--botao--cancelar">Cancelar</button>
                <button type="button" class="pesquisador-edicao--acao--botao--atualizar">Atualizar</button>
            </div>
        </div>
    </div>

    <script src="../../../public/js/script-pesquisador-edicao.js"></script>
