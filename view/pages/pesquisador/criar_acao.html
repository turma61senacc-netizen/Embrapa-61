
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../../public/css/criar_acao.css">
    <title>Criar Ação - Pesquisador</title>
</head>
<body>

    <main class="pesquisador-criarAcao--container--principal">

        <h1 class="pesquisador-criarAcao--titulo--pagina">Criar ação</h1>

        <section class="pesquisador-criarAcao--container--formulario">

            <div class="pesquisador-criarAcao--container--linhaSuperior">

                <div class="pesquisador-criarAcao--container--nome">
                    <label class="pesquisador-criarAcao--label--campo" for="pesquisador-criarAcao--input--nome">
                        Título Da Ação:
                    </label>

                    <input
                        type="text"
                        id="pesquisador-criarAcao--input--nome"
                        class="pesquisador-criarAcao--input--nome"
                        placeholder="Digite o nome do artigo aqui...">
                </div>

                <div class="pesquisador-criarAcao--container--data">
                    <label class="pesquisador-criarAcao--label--campo" for="pesquisador-criarAcao--input--data">
                        Data de Execução:
                    </label>

                    <input
                        type="date"
                        id="pesquisador-criarAcao--input--data"
                        class="pesquisador-criarAcao--input--data">
                </div>

            </div>

            <div class="pesquisador-criarAcao--container--descricao">
                <label class="pesquisador-criarAcao--label--campo" for="pesquisador-criarAcao--textarea--descricao">
                    Descrição:
                </label>

                <textarea
                    id="pesquisador-criarAcao--textarea--descricao"
                    class="pesquisador-criarAcao--textarea--descricao"
                    placeholder="Digite a descrição do artigo aqui..."></textarea>
            </div>

            <div class="pesquisador-criarAcao--container--campos">

                <div class="pesquisador-criarAcao--container--categoria">

                    <label class="pesquisador-criarAcao--label--campo">
                        Categoria da Ação:
                    </label>

                    <details class="pesquisador-criarAcao--dropdown">

                        <summary class="pesquisador-criarAcao--botao--categoria">
                            <span class="pesquisador-criarAcao--categoria--padrao">Selecionar ação</span>
                            <span class="pesquisador-criarAcao--categoria--palestra">Palestra</span>
                            <span class="pesquisador-criarAcao--categoria--pesquisa">Pesquisa</span>
                            <span class="pesquisador-criarAcao--categoria--entrevista">Entrevista</span>
                        </summary>

                        <div class="pesquisador-criarAcao--lista--categoria">

                            <input
                                type="radio"
                                name="categoria"
                                id="pesquisador-criarAcao--radio--palestra"
                                value="palestra">

                            <label for="pesquisador-criarAcao--radio--palestra">
                                Palestra
                            </label>

                            <input
                                type="radio"
                                name="categoria"
                                id="pesquisador-criarAcao--radio--pesquisa"
                                value="pesquisa">

                            <label for="pesquisador-criarAcao--radio--pesquisa">
                                Pesquisa
                            </label>

                            <input
                                type="radio"
                                name="categoria"
                                id="pesquisador-criarAcao--radio--entrevista"
                                value="entrevista">

                            <label for="pesquisador-criarAcao--radio--entrevista">
                                Entrevista
                            </label>

                        </div>
                    </details>
                </div>

                <div class="pesquisador-criarAcao--container--url">
                    <label class="pesquisador-criarAcao--label--campo" for="pesquisador-criarAcao--input--url">
                        Comprovante URL:
                    </label>

                    <input
                        type="text"
                        id="pesquisador-criarAcao--input--url"
                        class="pesquisador-criarAcao--input--url"
                        placeholder="Digite a URL do seu link...">
                </div>

                <div class="pesquisador-criarAcao--container--comprovantes">
                    <label class="pesquisador-criarAcao--label--campo">
                        Comprovantes:
                    </label>

                    <div class="pesquisador-criarAcao--container--upload">

                        <img
                            src="../../../public/imagens/Arquivo_Upload.png"
                            class="pesquisador-criarAcao--imagem--upload"
                            alt="Upload">

                        <span class="pesquisador-criarAcao--texto--upload">
                            <b>Arraste seus arquivos aqui ou clique para fazer Upload</b>
                            <small class="pesquisador-criarAcao--texto--formatos">
                                (PDF, DOCX, Imagens...)
                            </small>
                        </span>

                    </div>
                </div>

                <div class="pesquisador-criarAcao--container--botoes">

                    <button class="pesquisador-criarAcao--botao--cancelar">
                        Cancelar
                    </button>

                    <div class="pesquisador-criarAcao--container--postar">

                        <p class="pesquisador-criarAcao--texto--revisao">
                            Sua postagem será revisada em breve
                        </p>

                        <button class="pesquisador-criarAcao--botao--postar">
                            Postar
                        </button>

                    </div>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
