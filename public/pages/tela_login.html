<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="login-background">
        <div class="login-card">
            <img class="login-logo" src="../../public/imagens/logo_embrapa.png">
            <h1 class="login-titulo">Bem-Vindo</h1>
            <p class="login-paragrafo">Por favor, preencha os campos com seus dados.</p>
            <input class="login-input" type="email" placeholder="Digite seu E-mail aqui.">
            <label class="login-funcao" for="funcoes">Selecione sua função:</label>
            <select class="login-dropdown" id="funcoes" name="funcoes">
                <option value="adm">Administrador</option>
                <option value="pesquisador">Pesquisador</option>
                <option value="validador">Validador</option>
                <option value="comite">Comitê</option>
            </select>
            <button class="login-botao">ENTRAR</button>
        </div>
    </main>
</body>
</html>
