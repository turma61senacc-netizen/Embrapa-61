<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motivo para rejeição da ação</title>
  <link rel="stylesheet" href="estilo.css">
  <script src="java.js"></script>
</head>
<body>
  <main class="modal" role="dialog" aria-labelledby="titulo">
    <button class="fechar" id="btnFechar" aria-label="Fechar">X</button>

    <h1 id="titulo">Motivo para rejeição da ação</h1>

    <label for="razao" class="rotulo">Razão</label>
    <textarea id="razao" placeholder="Explique o porquê a ação foi rejeitada, disserte sobre..."></textarea>
    <p class="erro" id="erro" hidden>Preencha o motivo da rejeição.</p>

    <div class="botoes">
      <button class="btn btn-cancelar" id="btnCancelar" type="button">Cancelar</button>
      <button class="btn btn-enviar" id="btnEnviar" type="button">Enviar</button>
    </div>
  </main>

</body>
</html>
