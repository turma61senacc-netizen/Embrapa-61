<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Pesquisador - Editar Ação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="edicao">

        <label for="acao">Ação:</label>
        <input type="text" id="acao">

        <label for="url">Comprovante URL:</label>
        <input type="text" id="url">

        <label>Comprovantes:</label>

        <label for="arquivos" class="comprovantes"></label>

        <input type="file" id="arquivos" multiple accept>

    </div>
<div class="botoes_edicao">
    <button class="botao_cancelar">Cancelar</button>
    <button class="botao_atualizar">Atualizar</button>
</div>

</body>
</html>
